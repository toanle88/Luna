name: Feature request
description: Propose a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the expected user flow and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy, storage, and compatibility considerations
      description: Explain any effect on existing data, locales, or offline use.
